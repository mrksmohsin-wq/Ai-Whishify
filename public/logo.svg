<svg width="200" height="200" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pinkGradSquare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAEAE" />
      <stop offset="100%" stop-color="#FF9696" />
    </radialGradient>
    <filter id="subtleShadowSquare" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 16-Petal Scalloped Circular Badge: Equal 1:1 Length and Width -->
  <g id="badge-rosette">
    <!-- Outer scalloped path: width = 147.2, height = 147.2, perfectly 1:1 ratio centered at (100, 100) -->
    <path
      d="M 85.4 26.4 A 17.5 17.5 0 0 1 114.6 26.4 A 17.5 17.5 0 0 1 141.7 37.6 A 17.5 17.5 0 0 1 162.4 58.3 A 17.5 17.5 0 0 1 173.6 85.4 A 17.5 17.5 0 0 1 173.6 114.6 A 17.5 17.5 0 0 1 162.4 141.7 A 17.5 17.5 0 0 1 141.7 162.4 A 17.5 17.5 0 0 1 114.6 173.6 A 17.5 17.5 0 0 1 85.4 173.6 A 17.5 17.5 0 0 1 58.3 162.4 A 17.5 17.5 0 0 1 37.6 141.7 A 17.5 17.5 0 0 1 26.4 114.6 A 17.5 17.5 0 0 1 26.4 85.4 A 17.5 17.5 0 0 1 37.6 58.3 A 17.5 17.5 0 0 1 58.3 37.6 A 17.5 17.5 0 0 1 85.4 26.4 Z"
      fill="url(#pinkGradSquare)"
      stroke="#1E1624"
      stroke-width="3.5"
      stroke-linejoin="round"
      filter="url(#subtleShadowSquare)"
    />

    <!-- Inner concentric scalloped ring border: perfectly 1:1 centered at (100, 100) -->
    <path
      d="M 87.3 36.2 A 15 15 0 0 1 112.7 36.2 A 15 15 0 0 1 136.1 46.0 A 15 15 0 0 1 154.0 63.9 A 15 15 0 0 1 163.8 87.3 A 15 15 0 0 1 163.8 112.7 A 15 15 0 0 1 154.0 136.1 A 15 15 0 0 1 136.1 154.0 A 15 15 0 0 1 112.7 163.8 A 15 15 0 0 1 87.3 163.8 A 15 15 0 0 1 63.9 154.0 A 15 15 0 0 1 46.0 136.1 A 15 15 0 0 1 36.2 112.7 A 15 15 0 0 1 36.2 87.3 A 15 15 0 0 1 46.0 63.9 A 15 15 0 0 1 63.9 46.0 A 15 15 0 0 1 87.3 36.2 Z"
      fill="none"
      stroke="#1E1624"
      stroke-width="1.8"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Central Detailed Firework Burst -->
    <g stroke="#1E1624" stroke-width="1.15" stroke-linecap="round" opacity="0.95" transform="translate(100, 78)">
      <!-- Main radial rays -->
      <line x1="0" y1="0" x2="0" y2="-22" />
      <line x1="0" y1="0" x2="6" y2="-20" />
      <line x1="0" y1="0" x2="13" y2="-17" />
      <line x1="0" y1="0" x2="19" y2="-11" />
      <line x1="0" y1="0" x2="22" y2="-4" />
      <line x1="0" y1="0" x2="22" y2="4" />
      <line x1="0" y1="0" x2="18" y2="12" />
      <line x1="0" y1="0" x2="13" y2="18" />
      <line x1="0" y1="0" x2="5" y2="21" />
      <line x1="0" y1="0" x2="-2" y2="22" />
      <line x1="0" y1="0" x2="-9" y2="19" />
      <line x1="0" y1="0" x2="-16" y2="14" />
      <line x1="0" y1="0" x2="-20" y2="7" />
      <line x1="0" y1="0" x2="-22" y2="-2" />
      <line x1="0" y1="0" x2="-19" y2="-11" />
      <line x1="0" y1="0" x2="-13" y2="-17" />
      <line x1="0" y1="0" x2="-6" y2="-21" />

      <!-- Secondary fine sparkles -->
      <line x1="0" y1="0" x2="3" y2="-14" stroke-width="0.8" />
      <line x1="0" y1="0" x2="10" y2="-12" stroke-width="0.8" />
      <line x1="0" y1="0" x2="15" y2="-5" stroke-width="0.8" />
      <line x1="0" y1="0" x2="14" y2="6" stroke-width="0.8" />
      <line x1="0" y1="0" x2="8" y2="13" stroke-width="0.8" />
      <line x1="0" y1="0" x2="-5" y2="14" stroke-width="0.8" />
      <line x1="0" y1="0" x2="-12" y2="8" stroke-width="0.8" />
      <line x1="0" y1="0" x2="-14" y2="-6" stroke-width="0.8" />
      <line x1="0" y1="0" x2="-8" y2="-13" stroke-width="0.8" />

      <!-- Stippled tips / star dust -->
      <circle cx="0" cy="-24" r="0.85" fill="#1E1624" />
      <circle cx="15" cy="-19" r="0.75" fill="#1E1624" />
      <circle cx="24" cy="-5" r="0.75" fill="#1E1624" />
      <circle cx="21" cy="14" r="0.85" fill="#1E1624" />
      <circle cx="6" cy="23" r="0.75" fill="#1E1624" />
      <circle cx="-11" cy="21" r="0.75" fill="#1E1624" />
      <circle cx="-23" cy="8" r="0.85" fill="#1E1624" />
      <circle cx="-23" cy="-4" r="0.75" fill="#1E1624" />
      <circle cx="-15" cy="-19" r="0.85" fill="#1E1624" />
    </g>

    <!-- Cursive "Ai Wishify" Typography -->
    <text
      x="100"
      y="132"
      text-anchor="middle"
      font-family="'Dancing Script', 'Caveat', cursive"
      font-size="24"
      font-weight="700"
      fill="#1E1624"
      letter-spacing="0.2"
    >
      Ai Wishify
    </text>
  </g>
</svg>
